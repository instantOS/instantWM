name: Release
on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
    tags:
      - "v*"
  workflow_dispatch:
jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    if: ${{ github.repository_owner == 'instantOS' }}
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.metadata.outputs.should_release }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Determine release tag
        id: metadata
        run: bash scripts/ci/determine-release.sh
  build:
    name: Build release artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    container:
      image: archlinux:latest
    needs: metadata
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$PWD"
      - name: Determine target triple
        id: target
        run: |
          target=$(rustc -vV | awk '/^host:/ {print $2}')
          if [[ -z "$target" ]]; then
            echo "Failed to determine host target triple" >&2
            exit 1
          fi
          echo "triple=$target" >> "$GITHUB_OUTPUT"
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      # No cargo test here: ci.yml already runs the test suite for every
      # commit on main/PRs, so the release path only builds (same trade-off
      # as instantCLI's release pipeline).
      - name: Build release binary
        run: |
          WORKSPACE="$PWD"
          su builder -c "cd '$WORKSPACE' && CARGO_TERM_COLOR=always cargo build --release --locked"
      - name: Strip binary
        run: |
          WORKSPACE="$PWD"
          su builder -c "cd '$WORKSPACE' && strip target/release/instantwm target/release/instantwmctl"
      - name: Collect artifacts
        run: bash scripts/ci/package-binary.sh "${{ steps.target.outputs.triple }}" "${{ steps.vars.outputs.version }}" target/release
      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: instantwm-${{ steps.vars.outputs.version }}-${{ steps.target.outputs.triple }}
          path: |
            artifacts/instantwm-${{ steps.target.outputs.triple }}-v${{ steps.vars.outputs.version }}.tgz
            artifacts/instantwm-${{ steps.target.outputs.triple }}-v${{ steps.vars.outputs.version }}.tgz.sha256
  cross-compile:
    # GNU ARM cross builds use Ubuntu sysroots. The apk job builds musl
    # natively on Alpine, including the required native graphics libraries.
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    container:
      image: ubuntu:26.04
    needs: metadata
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            triple: aarch64-linux-gnu
          - arch: armhf
            target: armv7-unknown-linux-gnueabihf
            triple: arm-linux-gnueabihf
    env:
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install host build dependencies
        run: bash scripts/ci/install-deps-ubuntu.sh
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Add Rust cross-compilation target
        run: rustup target add ${{ matrix.target }}
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross-deps
          key: cross-${{ matrix.target }}
      - name: Build cross sysroot
        run: bash scripts/ci/install-deps-ubuntu.sh --cross ${{ matrix.arch }} "$PWD/sysroot/${{ matrix.arch }}"
      - name: Cross compile
        # Container jobs default to `sh`, which is dash on Ubuntu and does
        # not support `pipefail`.
        shell: bash
        env:
          SYSROOT: ${{ github.workspace }}/sysroot/${{ matrix.arch }}
        run: |
          set -euo pipefail
          eval "$(bash scripts/ci/install-deps-ubuntu.sh --env ${{ matrix.arch }} "$SYSROOT")"
          cargo build --locked --release --target "${{ matrix.target }}"
      - name: Strip binary
        run: |
          "${{ matrix.triple }}-strip" "target/${{ matrix.target }}/release/instantwm" "target/${{ matrix.target }}/release/instantwmctl"
      - name: Collect artifact
        run: bash scripts/ci/package-binary.sh "${{ matrix.target }}" "${{ steps.vars.outputs.version }}" "target/${{ matrix.target }}/release"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: instantwm-${{ steps.vars.outputs.version }}-${{ matrix.target }}
          path: |
            artifacts/instantwm-${{ matrix.target }}-v${{ steps.vars.outputs.version }}.tgz
            artifacts/instantwm-${{ matrix.target }}-v${{ steps.vars.outputs.version }}.tgz.sha256
      - name: Clean up toolchains
        if: always()
        run: rm -rf /opt/cargo /opt/rustup
  pkgbuild:
    name: Build Arch binary package
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    container:
      image: archlinux:latest
    needs:
      - metadata
      - build
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
        with:
          packages: base-devel pacman-contrib
          include-test-base: 'false'
      - name: Download native archive
        uses: actions/download-artifact@v8
        with:
          name: instantwm-${{ needs.metadata.outputs.version }}-x86_64-unknown-linux-gnu
          path: arch-build
      - name: Build package
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cp packaging/arch-bin/PKGBUILD arch-build/
          useradd -m builder
          chown -R builder:builder arch-build
          cd arch-build
          if ! grep -Fxq "pkgver=$VERSION" PKGBUILD; then
            sed -i "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi
          runuser -u builder -- updpkgsums
          runuser -u builder -- makepkg --nodeps --noconfirm
      - name: Collect package artifacts
        run: |
          mkdir -p artifacts
          mv arch-build/*.pkg.tar.zst artifacts/
      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: instantwm-${{ needs.metadata.outputs.version }}-arch-bin-package
          path: artifacts/
  deb:
    name: Build Debian package
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    needs:
      - metadata
      - build
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          bash scripts/ci/install-deps-ubuntu.sh
          apt-get install -y --no-install-recommends dpkg-dev
      - name: Extract version
        id: vars
        run: bash scripts/ci/extract-version.sh "$GITHUB_REF_NAME"
      - name: Download native build artifact
        uses: actions/download-artifact@v8
        with:
          name: instantwm-${{ steps.vars.outputs.version }}-x86_64-unknown-linux-gnu
          path: dist
      - name: Extract binary from tarball
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          tar -xzf "dist/instantwm-x86_64-unknown-linux-gnu-v${VERSION}.tgz" -C dist
          install -Dm0755 "dist/instantwm-x86_64-unknown-linux-gnu-v${VERSION}/instantwm" target/release/instantwm
          install -Dm0755 "dist/instantwm-x86_64-unknown-linux-gnu-v${VERSION}/instantwmctl" target/release/instantwmctl
      - name: Build .deb package
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          chmod +x utils/build_deb.sh
          ./utils/build_deb.sh
      - name: Collect deb artifacts
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          mkdir -p artifacts
          mv "target/deb/instantwm_${VERSION}_amd64.deb" artifacts/
          cd artifacts && sha256sum "instantwm_${VERSION}_amd64.deb" > "instantwm_${VERSION}_amd64.deb.sha256"
      - name: Upload deb package
        uses: actions/upload-artifact@v7
        with:
          name: instantwm-${{ steps.vars.outputs.version }}-deb
          path: artifacts/
  apk:
    name: Build Alpine package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    needs: metadata
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Cache Alpine Cargo dependencies and build output
        uses: actions/cache@v4
        with:
          path: |
            target/apk-cargo
            target/apk-build
          key: alpine-3.24-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'packaging/alpine/APKBUILD.in') }}
          restore-keys: alpine-3.24-${{ matrix.arch }}-
      - name: Build native Alpine package
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e EXPECTED_ARCH \
            -e CARGO_HOME=/work/target/apk-cargo \
            -e APK_CARGO_TARGET_DIR=/work/target/apk-build \
            -e CARGO_BUILD_JOBS=2 alpine:3.24 sh -ec '
              test "$(apk --print-arch)" = "$EXPECTED_ARCH"
              apk add --update-cache abuild
              SUDO= abuild-keygen -a -n -i
              ./utils/build_apk.sh
            '
      - name: Smoke test Alpine installation
        run: |
          docker run --rm -v "$PWD/target/apk:/packages:ro" alpine:3.24 sh -ec '
            cd /packages
            sha256sum -c ./*.apk.sha256
            apk add --no-cache --allow-untrusted ./*.apk
            instantwm --help > /dev/null
            instantwmctl --help > /dev/null
            command -v dbus-run-session
            command -v setxkbmap
            test -x /usr/bin/startinstantos
            test -x /usr/bin/instantwm-debug
            test -f /usr/share/xsessions/instantwm.desktop
            test -f /usr/share/wayland-sessions/instantwm-wayland.desktop
            test -f /usr/share/xdg-desktop-portal/instantwm-portals.conf
          '
      - name: Upload Alpine package
        uses: actions/upload-artifact@v7
        with:
          name: instantwm-${{ needs.metadata.outputs.version }}-apk-${{ matrix.arch }}
          path: |
            target/apk/*.apk
            target/apk/*.apk.sha256
  release:
    name: Publish GitHub release
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04
    needs:
      - metadata
      - build
      - cross-compile
      - pkgbuild
      - deb
      - apk
    permissions:
      contents: write
    if: ${{ needs.metadata.outputs.should_release == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bash scripts/ci/extract-release-notes.sh "$VERSION" > release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          name: ${{ needs.metadata.outputs.tag }}
          body_path: release-notes.md
          files: dist/**/*
          # The AUR pins the published archive checksum across reruns.
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  aur-recipes:
    name: Prepare AUR recipes
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    needs: [metadata, release]
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Arch container
        uses: ./.github/actions/setup-arch
        with:
          include-test-base: 'false'
          packages: base-devel pacman-contrib
      - name: Generate versioned recipes
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          useradd -m builder
          chown -R builder:builder packaging/arch packaging/arch-bin
          for directory in packaging/arch packaging/arch-bin; do
            package=instantwm${directory#packaging/arch}
            (
              cd "$directory"
              if ! grep -Fxq "pkgver=$VERSION" PKGBUILD; then
                sed -i "s/^pkgver=.*/pkgver=$VERSION/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
              fi
              runuser -u builder -- updpkgsums
              runuser -u builder -- makepkg --printsrcinfo > .SRCINFO
            )
            install -Dm644 "$directory/PKGBUILD" "aur-recipes/$package/PKGBUILD"
            install -Dm644 "$directory/.SRCINFO" "aur-recipes/$package/.SRCINFO"
          done
      - name: Smoke test instantwm-bin installation
        run: |
          cd packaging/arch-bin
          runuser -u builder -- makepkg --nodeps --noconfirm
          pacman -U --noconfirm ./*.pkg.tar.zst
          instantwm --help > /dev/null
          instantwmctl --help > /dev/null
          command -v dbus-run-session
          command -v setxkbmap
          test -x /usr/bin/startinstantos
          test -x /usr/bin/instantwm-debug
          test -f /usr/share/xsessions/instantwm.desktop
          test -f /usr/share/wayland-sessions/instantwm-wayland.desktop
          test -f /usr/share/xdg-desktop-portal/instantwm-portals.conf
      - name: Upload AUR recipes
        uses: actions/upload-artifact@v7
        with:
          name: aur-recipes
          path: aur-recipes/
          include-hidden-files: true
          if-no-files-found: error
  aur:
    name: Publish to the AUR
    runs-on: ubuntu-26.04
    container:
      image: archlinux:latest
    needs: aur-recipes
    permissions:
      contents: read
    if: |-
      github.repository == 'instantOS/instantWM' &&
      (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && github.ref_protected))
    concurrency:
      group: aur-publish
      cancel-in-progress: false
    steps:
      - name: Check for AUR SSH key
        id: aur-key
        env:
          KEY_CONFIGURED: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
        run: |
          echo "configured=$KEY_CONFIGURED" >> "$GITHUB_OUTPUT"
          if [ "$KEY_CONFIGURED" != true ]; then
            echo 'AUR_SSH_PRIVATE_KEY is unset. Skipping AUR publishing.'
          fi
      - name: Install publishing tools
        if: steps.aur-key.outputs.configured == 'true'
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm --needed git openssh
      - name: Checkout release commit
        if: steps.aur-key.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download AUR recipes
        if: steps.aur-key.outputs.configured == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aur-recipes
          path: aur-recipes
      - name: Push recipes to the AUR
        if: steps.aur-key.outputs.configured == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: bash scripts/ci/publish-aur.sh aur-recipes
