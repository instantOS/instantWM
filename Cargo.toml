[package]
name = "instantwm"
version = "0.7.0"
edition = "2024"
description = "Hybrid tiling window manager for X11 and Wayland"
license = "MIT"
authors = ["instantWM contributors"]
keywords = ["window-manager", "x11", "wayland", "tiling"]
categories = ["gui"]
publish = false

[dependencies]
x11rb = { version = "0.13", features = ["cursor", "randr", "xinerama", "xinput", "xkb", "shm", "render", "composite", "damage", "dpms", "dri2", "dri3", "glx", "present", "record", "res", "sync", "xf86dri", "xf86vidmode", "xfixes", "xprint", "xselinux", "xtest", "xv", "xvmc", "allow-unsafe-code", "dl-libxcb"] }
libc = "0.2"
fontconfig = "0.10"
freetype = "0.7"
bitflags = "2.11"
thiserror = "2.0"
once_cell = "1.21"
anyhow = "1.0"
log = { version = "0.4", features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "2.0"
toml = "1.1"
dirs = "6.0"
xcursor = "0.3"

# Wayland compositor support via Smithay
smithay = { version = "0.7.0", git = "https://github.com/Smithay/smithay.git", rev = "023b78b1c5a05ca512767cacc07efca55fae8be4", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_gbm_has_fd_for_plane",
    "backend_gbm_has_create_with_modifiers2",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "use_system_lib",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
calloop = { version = "0.14" }
cosmic-text = "0.19"
unicode-segmentation = "1.13"
zbus = { version = "5" }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
serde_json = "1.0"
# Tray SVGs are vector artwork; omit font discovery, text layout and bitmap codecs.
resvg = { version = "0.48.1", default-features = false }
png = "0.18"
instantos-terminal = { version = "0.1.0", git = "https://github.com/instantOS/instantOS-libs" }

[build-dependencies]

[dev-dependencies]
tempfile = "3"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

# Fast enough to represent compositor behaviour while retaining source locations.
# This deliberately does not inherit the slow, stripped release profile.
[profile.profiling]
inherits = "dev"
opt-level = 2
debug = "full"
strip = "none"
debug-assertions = false
